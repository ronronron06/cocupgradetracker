var sumKey=null,sumRefs=[];
function icsAll(list,out){
  var now=Date.now(),L=list.filter(function(p){return p[1].end>now;});
  function z(ms){return new Date(ms).toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");}
  function q(t){return String(t).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");}
  var o=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//CoC Tracker//EN","CALSCALE:GREGORIAN"];
  L.forEach(function(p,n){
    var i=p[1],st=Math.ceil(i.end/6e4)*6e4;
    var t="CoC "+p[0]+": "+i.n+(i.lvl!=null?" ("+i.lvl+" to "+(i.lvl+1)+")":"")+" done";
    o.push("BEGIN:VEVENT","UID:coc-"+p[2]+"-"+n+"-"+i.k+"-"+i.end+"@coc-tracker","DTSTAMP:"+z(now),"DTSTART:"+z(st),"DTEND:"+z(st+3e5),"SUMMARY:"+q(t),"DESCRIPTION:"+q("Clash of Clans upgrade finished"),"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+q(t),"TRIGGER:PT0S","END:VALARM","END:VEVENT");
  });
  o.push("END:VCALENDAR");
  out.style.display="block";
  if(!L.length){out.textContent="Nothing to add.";return;}
  try{
    var u=URL.createObjectURL(new Blob([o.join("\r\n")+"\r\n"],{type:"text/calendar;charset=utf-8"}));
    var a=document.createElement("a");a.href=u;a.download="coc-upgrades.ics";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(u);},10000);
    out.textContent="Downloaded coc-upgrades.ics with "+L.length+" reminders. Open the file to add them to Calendar.";
  }catch(e){out.textContent="Download is blocked in this browser.";}
}
function tfmt(ms){
  var d=new Date(ms),tz=undefined;
  try{
    var t=new Intl.DateTimeFormat("en-US",{timeZone:tz,hour:"numeric",minute:"2-digit",hour12:true}).format(d);
    var f=new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"});
    var df=Math.round((Date.parse(f.format(d))-Date.parse(f.format(new Date())))/864e5);
    if(df<=0)return "Today "+t;
    if(df===1)return "Tomorrow "+t;
    return new Intl.DateTimeFormat("en-US",{timeZone:tz,weekday:"short",month:"short",day:"numeric"}).format(d)+" "+t;
  }catch(e){return d.toLocaleString();}
}
function calUrl(title,ms){
  function z(x){return x.toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");}
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(title)+"&details="+encodeURIComponent("Clash of Clans upgrade finished")+"&dates="+z(new Date(ms))+"/"+z(new Date(ms+3e5));
}
function alarmLink(acc,i,now){

    a.href="intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR="+d.getHours()+";i.android.intent.extra.alarm.MINUTES="+d.getMinutes()+";S.android.intent.extra.alarm.MESSAGE="+encodeURIComponent(title)+";B.android.intent.extra.alarm.SKIP_UI=false;S.browser_fallback_url="+encodeURIComponent(cu)+";end";
  }else{a.href=cu;a.target="_blank";a.rel="noopener noreferrer";}
  return a;
}
function summary(now){
  var s=document.getElementById("sum");if(!s)return;
  var al=[],rd=[],nx=[];
  S.a.forEach(function(a,ix){
    var st=stat(a,now),p=[];
    if(st.bIdle)p.push(st.bIdle+(st.bIdle>1?" builders":" builder")+" idle");
    if(st.lIdle)p.push("lab idle");
    if(p.length)al.push(a.name+": "+p.join(", "));
    a.hp.forEach(function(h){if(h.end<=now)rd.push([a.name,h.n,ix]);});
    a.items.forEach(function(i){if(i.end>now)nx.push([a.name,i,ix]);});
  });
  nx.sort(function(x,y){return x[1].end-y[1].end;});
  var show=nx.slice(0,10);
  var key=S.a.map(function(a){return a.name;}).join("|")+"#"+al.join("|")+"#"+rd.map(function(p){return p[2]+p[1];}).join(",")+"#"+show.map(function(p){return p[2]+":"+p[1].n+":"+p[1].end+":"+(p[1].end-now<864e5?1:0);}).join(",")+"#"+Math.floor((now+288e5)/864e5);
  if(key===sumKey){
    sumRefs.forEach(function(q){var r=q.e-now;q.c.textContent=fmt(r);q.r.classList.toggle("soon",r<36e5);});
    return;
  }
  sumKey=key;sumRefs=[];s.textContent="";
  if(al.length){var b=el("div","alert");al.forEach(function(t){b.appendChild(el("div",null,t));});s.appendChild(b);}
  if(rd.length){
    var rb=el("div","rdy");
    rd.forEach(function(p){
      var r=el("div","rrow");
      r.appendChild(pill(p[0],p[2]));
      r.appendChild(el("span",null,p[1]+" is ready"));
      rb.appendChild(r);
    });
    rb.appendChild(el("div","mut","Used it in game? Export and import again to sync the new cooldown."));
    s.appendChild(rb);
  }
  var hr=el("div","hrow");hr.appendChild(el("h2",null,"Next to finish"));
  s.appendChild(hr);
  if(slotEl){
    slotEl.textContent="";
    if(show.length){
      var ba=el("button","bigal","\u23F0 Set all ("+show.length+")");ba.type="button";
      ba.setAttribute("aria-label","Download one calendar file with reminders for all listed upgrades");
      ba.onclick=function(){icsAll(show,hnEl);};
      slotEl.appendChild(ba);
    }
  }
  if(hnEl)hnEl.style.display="none";
  if(!nx.length)s.appendChild(el("div","mut","Nothing running."));
  show.forEach(function(p){
    var i=p[1],r=el("div",((i.end-now<36e5)?"row soon":"row")+" sr");
    var s1=el("div","s1");s1.appendChild(pill(p[0],p[2]));s1.appendChild(el("span","k",KN[i.k]));
    var s2=el("div","s2");s2.appendChild(el("span","nmx",i.n));
    if(i.lvl!=null)s2.appendChild(el("span","lv",i.lvl+"\u2192"+(i.lvl+1)));
    if(i.h)s2.appendChild(el("span","bd","helper"));
    if(i.x)s2.appendChild(el("span","bd","extra"));
    var cdv=el("div","cd",fmt(i.end-now));
    r.appendChild(s1);r.appendChild(cdv);r.appendChild(s2);r.appendChild(el("div","at",tfmt(i.end)));
    r.appendChild(alarmLink(p[0],i,now));
    s.appendChild(r);
    sumRefs.push({c:cdv,e:i.end,r:r});
  });
}
function paint(now){
  document.querySelectorAll("[data-end]").forEach(function(e){
    var r=Number(e.getAttribute("data-end"))-now,isH=e.hasAttribute("data-h"),p=e.parentNode;
    e.textContent=isH?(r>0?fmt(r):(e.getAttribute("data-h")==="p"?"Ended":"Ready")):fmt(r);
